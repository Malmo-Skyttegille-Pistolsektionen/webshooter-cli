name: Release

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  lint:
    name: Lint and format check
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"
    
    - name: Install Hatch
      run: pip install hatch
    
    - name: Check formatting with Black
      run: hatch run dev:black --check --verbose src tests
    
    - name: Lint with flake8
      run: hatch run dev:flake8

  test:
    name: Test before release
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"
    
    - name: Install Hatch
      run: pip install hatch
    
    - name: Run tests
      run: hatch run dev:pytest tests -v --cov=src/webshooter_client --cov-report=term-missing

  build:
    name: Build package
    needs: [lint, test]
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Full history for hatch-vcs to determine version
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"
    
    - name: Install Hatch
      run: pip install hatch
    
    - name: Build package
      run: hatch build
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/

  generate-changelog:
    name: Generate changelog with git-cliff
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    outputs:
      changelog: ${{ steps.git-cliff.outputs.content }}
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Generate changelog
      id: git-cliff
      uses: orhun/git-cliff-action@v4
      with:
        config: cliff.toml
        args: --verbose --latest --strip header
      env:
        OUTPUT: CHANGELOG.md
        GITHUB_REPO: ${{ github.repository }}

  upload-release-assets:
    name: Upload release assets and update description
    needs: [build, generate-changelog]
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    
    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist
    
    - name: Upload wheel and update release with changelog
      uses: softprops/action-gh-release@v2
      with:
        files: dist/*
        body: ${{ needs.generate-changelog.outputs.changelog }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

