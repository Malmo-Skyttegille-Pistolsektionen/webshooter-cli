name: CI

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

jobs:
  lint:
    name: Lint and format check
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v7.0.1
    
    - name: Set up Python
      uses: actions/setup-python@v7.0.0
      with:
        python-version: "3.14.7"
    
    - name: Install Hatch
      run: pip install hatch
    
    - name: Check formatting with Black
      run: hatch run dev:black --check --verbose src tests
    
    - name: Lint with flake8
      run: hatch run dev:flake8

  test:
    name: Test on Python ${{ matrix.python-version }}
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]

    steps:
    - uses: actions/checkout@v7.0.1
      with:
        fetch-depth: 0  # Full history for hatch-vcs
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7.0.0
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install Hatch
      run: pip install hatch
    
    - name: Run tests
      run: hatch run dev:pytest tests -v --cov=src/webshooter_client --cov-report=term-missing
    
    - name: Upload coverage reports
      if: matrix.python-version == '3.13'
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
      continue-on-error: true
  
  # The context the ruleset requires, instead of the matrix job itself.
  #
  # A matrix job's context always carries its matrix values -- GitHub appends
  # them even for a single entry, so `test` reports as "Test on Python 3.13"
  # whatever the job is called. Requiring that string means a Python bump
  # renames the context, after which the required check never reports and every
  # pull request is blocked with nothing to explain it. This job's name has
  # nothing in it to move.
  #
  # `if: always()` is load-bearing: without it a failed or skipped `test` skips
  # this job too, and a required check that never reports blocks the branch just
  # as badly as a failing one -- only more confusingly.
  tests:
    name: Tests
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
    - name: Fail unless every test leg succeeded
      if: needs.test.result != 'success'
      run: |
        echo "test job result: ${{ needs.test.result }}"
        exit 1

  build:
    name: Build package
    needs: test
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        fetch-depth: 0  # Full history for hatch-vcs
    
    - name: Set up Python
      uses: actions/setup-python@v7.0.0
      with:
        python-version: "3.14.7"
    
    - name: Install Hatch
      run: pip install hatch
    
    - name: Build package
      run: hatch build
    
    - name: Test installation from wheel
      run: |
        WHL_FILE=$(ls dist/*.whl)
        pip install $WHL_FILE
        wscli --help
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v7.0.1
      with:
        name: dist
        path: dist/

